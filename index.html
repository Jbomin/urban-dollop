<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포물선 운동 비교 실험실</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;
  --grid:#e5e7eb;--A:#2563eb;--B:#e11d48;--dark:#111827;--good:#047857
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1260px;margin:auto;padding:20px}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}
.lead{margin:0 0 16px;color:var(--muted);line-height:1.6}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
button:active{transform:translateY(1px)}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.9fr);gap:12px}
canvas{display:block;width:100%;height:auto;border:1px solid var(--grid);border-radius:12px;background:#fff}
.global{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
label{font-size:13px;color:var(--muted);display:block}
input,select{font:inherit}
input[type=number],select{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:4px}
input[type=range]{width:100%;cursor:pointer}
.timebar{margin-top:10px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.proj{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff}
.proj h3{margin:0 0 8px;font-size:17px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.value{color:var(--text);font-weight:700}
.vectorPad{width:100%;max-width:210px;aspect-ratio:1;margin:8px auto;display:block;touch-action:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.stat{background:#f9fafb;border:1px solid var(--grid);border-radius:9px;padding:8px}
.stat b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.stat span{font-size:13px}
.compare{margin-top:10px;line-height:1.55}
.hint{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.6}
.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 8px;margin:2px 3px 2px 0;background:#fff}
.small{font-size:13px;color:var(--muted)}
@media(max-width:950px){.layout{grid-template-columns:1fr}.global{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.controls{grid-template-columns:1fr}.row,.stats{grid-template-columns:1fr 1fr}.global{grid-template-columns:1fr 1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>포물선 운동 비교 실험실</h1>
  <p class="lead">A와 B를 동시에 발사해 비교하세요. <b>속도와 각도는 슬라이더 또는 원형 조절판의 점을 직접 끌어서</b> 바꿀 수 있습니다. 출발 위치·중력·착지 높이도 자유롭게 바꿀 수 있습니다.</p>

  <div class="toolbar">
    <button id="launch" class="primary">▶ 동시 발사</button>
    <button id="pause">⏸ 일시정지</button>
    <button id="reset">↺ 시간 초기화</button>
    <button id="matchLanding">B 도착점을 A와 맞추기</button>
    <span class="small" id="clock">t = 0.00 s</span>
  </div>

  <div class="layout">
    <section>
      <div class="card">
        <div class="global">
          <label>중력 g (m/s²)<input id="g" type="number" min="0.1" max="30" step="0.1" value="9.8"></label>
          <label>착지 높이 y (m)<input id="ground" type="number" min="-100" max="100" step="1" value="0"></label>
          <label>재생 배속
            <select id="playback">
              <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
              <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
            </select>
          </label>
          <label>최대 속도 (조절판)<input id="maxSpeed" type="number" min="10" max="300" step="10" value="100"></label>
        </div>

        <canvas id="canvas" width="900" height="540" aria-label="포물선 운동 비교 그래프"></canvas>

        <div class="timebar">
          <label>시간 직접 이동: <span id="timeOut" class="value">0.00 s</span></label>
          <input id="timeSlider" type="range" min="0" max="10" step="0.01" value="0">
        </div>
      </div>

      <div class="card hint">
        <b>직접 탐구해 볼 것</b><br>
        <span class="badge">같은 속력 · 다른 각도</span>
        <span class="badge">같은 도착점 · 다른 각도</span>
        <span class="badge">같은 각도 · 다른 속력</span>
        <span class="badge">vx만 같게</span>
        <span class="badge">vy만 같게</span>
        <span class="badge">다른 출발 높이</span>
        <span class="badge">중력 변화</span><br>
        공기저항은 무시합니다. 운동식은 x(t)=x₀+vₓt, y(t)=y₀+vᵧt−½gt² 입니다.
      </div>
    </section>

    <section>
      <div class="controls">
        <div class="proj">
          <h3 style="color:var(--A)">● 포물체 A</h3>
          <svg id="padA" class="vectorPad" viewBox="0 0 220 220" aria-label="A 속도와 각도 드래그 조절판">
            <circle cx="110" cy="110" r="92" fill="#f8fafc" stroke="#d1d5db"/>
            <circle cx="110" cy="110" r="46" fill="none" stroke="#e5e7eb"/>
            <line x1="18" y1="110" x2="202" y2="110" stroke="#e5e7eb"/>
            <line x1="110" y1="18" x2="110" y2="202" stroke="#e5e7eb"/>
            <line id="arrowA" x1="110" y1="110" x2="150" y2="80" stroke="#2563eb" stroke-width="4"/>
            <circle id="handleA" cx="150" cy="80" r="10" fill="#2563eb"/>
            <text x="110" y="214" text-anchor="middle" font-size="12" fill="#6b7280">점을 끌어서 속도·각도 조절</text>
          </svg>
          <label>속도 v = <span id="vAOut" class="value"></span> m/s
            <input id="vA" type="range" min="0" max="100" step="0.5" value="25">
          </label>
          <label>각도 θ = <span id="angAOut" class="value"></span>°
            <input id="angA" type="range" min="-180" max="180" step="1" value="35">
          </label>
          <div class="row">
            <label>출발 x₀<input id="xA" type="number" step="1" value="0"></label>
            <label>출발 y₀<input id="yA" type="number" step="1" value="0"></label>
          </div>
          <div class="stats" id="statsA"></div>
        </div>

        <div class="proj">
          <h3 style="color:var(--B)">● 포물체 B</h3>
          <svg id="padB" class="vectorPad" viewBox="0 0 220 220" aria-label="B 속도와 각도 드래그 조절판">
            <circle cx="110" cy="110" r="92" fill="#f8fafc" stroke="#d1d5db"/>
            <circle cx="110" cy="110" r="46" fill="none" stroke="#e5e7eb"/>
            <line x1="18" y1="110" x2="202" y2="110" stroke="#e5e7eb"/>
            <line x1="110" y1="18" x2="110" y2="202" stroke="#e5e7eb"/>
            <line id="arrowB" x1="110" y1="110" x2="140" y2="55" stroke="#e11d48" stroke-width="4"/>
            <circle id="handleB" cx="140" cy="55" r="10" fill="#e11d48"/>
            <text x="110" y="214" text-anchor="middle" font-size="12" fill="#6b7280">점을 끌어서 속도·각도 조절</text>
          </svg>
          <label>속도 v = <span id="vBOut" class="value"></span> m/s
            <input id="vB" type="range" min="0" max="100" step="0.5" value="25">
          </label>
          <label>각도 θ = <span id="angBOut" class="value"></span>°
            <input id="angB" type="range" min="-180" max="180" step="1" value="60">
          </label>
          <div class="row">
            <label>출발 x₀<input id="xB" type="number" step="1" value="0"></label>
            <label>출발 y₀<input id="yB" type="number" step="1" value="0"></label>
          </div>
          <div class="stats" id="statsB"></div>
        </div>
      </div>

      <div class="card compare" id="compare"></div>
    </section>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const C = $('canvas'), ctx = C.getContext('2d');
  const E = {
    launch:$('launch'), pause:$('pause'), reset:$('reset'), match:$('matchLanding'), clock:$('clock'),
    g:$('g'), ground:$('ground'), playback:$('playback'), maxSpeed:$('maxSpeed'),
    slider:$('timeSlider'), timeOut:$('timeOut'),
    vA:$('vA'),angA:$('angA'),xA:$('xA'),yA:$('yA'),vAOut:$('vAOut'),angAOut:$('angAOut'),
    vB:$('vB'),angB:$('angB'),xB:$('xB'),yB:$('yB'),vBOut:$('vBOut'),angBOut:$('angBOut'),
    statsA:$('statsA'),statsB:$('statsB'),compare:$('compare'),
    padA:$('padA'),padB:$('padB'),handleA:$('handleA'),handleB:$('handleB'),arrowA:$('arrowA'),arrowB:$('arrowB')
  };
  let t=0, running=false, raf=null, last=0;

  const n=(el,f=0)=>{const v=Number(el.value);return Number.isFinite(v)?v:f};
  const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

  function projectile(prefix){
    const v=Math.max(0,n(E['v'+prefix])), a=n(E['ang'+prefix]);
    return {x0:n(E['x'+prefix]),y0:n(E['y'+prefix]),v,ang:a,vx:v*Math.cos(rad(a)),vy:v*Math.sin(rad(a))};
  }

  function landingTime(P,g,ground){
    // Solve y0 + vy*t - 1/2*g*t^2 = ground.
    const D=P.vy*P.vy+2*g*(P.y0-ground);
    if(D<0 || g<=0) return null;
    const s=Math.sqrt(D);
    const roots=[(P.vy+s)/g,(P.vy-s)/g].filter(v=>v>1e-7 && Number.isFinite(v));
    return roots.length?Math.max(...roots):null;
  }

  function analyze(P,g,ground){
    const T=landingTime(P,g,ground);
    const apexT=P.vy>0?P.vy/g:0;
    const maxY=P.y0+(P.vy>0?P.vy*P.vy/(2*g):0);
    const xf=T==null?null:P.x0+P.vx*T;
    return {...P,T,xf,dx:T==null?null:P.vx*T,maxY,apexT};
  }

  function state(){
    const g=Math.max(.01,n(E.g,9.8)), ground=n(E.ground,0);
    return {g,ground,A:analyze(projectile('A'),g,ground),B:analyze(projectile('B'),g,ground)};
  }

  function pos(P,tt,g){
    return {x:P.x0+P.vx*tt,y:P.y0+P.vy*tt-.5*g*tt*tt,vx:P.vx,vy:P.vy-g*tt};
  }

  function syncPad(prefix){
    const max=Math.max(1,n(E.maxSpeed,100)), v=clamp(n(E['v'+prefix]),0,max), a=rad(n(E['ang'+prefix]));
    E['v'+prefix].max=max;
    const R=92*(v/max);
    const x=110+R*Math.cos(a), y=110-R*Math.sin(a);
    E['handle'+prefix].setAttribute('cx',x);E['handle'+prefix].setAttribute('cy',y);
    E['arrow'+prefix].setAttribute('x2',x);E['arrow'+prefix].setAttribute('y2',y);
    E['v'+prefix+'Out'].textContent=v.toFixed(1);
    E['ang'+prefix+'Out'].textContent=n(E['ang'+prefix]).toFixed(0);
  }

  function bindPad(prefix){
    const svg=E['pad'+prefix];
    function setFromPointer(ev){
      const r=svg.getBoundingClientRect();
      const x=(ev.clientX-r.left)/r.width*220, y=(ev.clientY-r.top)/r.height*220;
      let dx=x-110, dy=110-y;
      const rr=Math.hypot(dx,dy);
      if(rr>92){dx*=92/rr;dy*=92/rr}
      const max=Math.max(1,n(E.maxSpeed,100));
      const speed=clamp(Math.hypot(dx,dy)/92*max,0,max);
      let angle=deg(Math.atan2(dy,dx));
      if(angle>180)angle-=360;if(angle<-180)angle+=360;
      E['v'+prefix].value=speed.toFixed(1);
      E['ang'+prefix].value=Math.round(angle);
      resetTime(false);
    }
    let dragging=false;
    svg.addEventListener('pointerdown',ev=>{dragging=true;svg.setPointerCapture(ev.pointerId);setFromPointer(ev)});
    svg.addEventListener('pointermove',ev=>{if(dragging)setFromPointer(ev)});
    svg.addEventListener('pointerup',()=>dragging=false);
    svg.addEventListener('pointercancel',()=>dragging=false);
  }

  function view(A,B,g,ground){
    let pts=[{x:A.x0,y:A.y0},{x:B.x0,y:B.y0},{x:0,y:ground}];
    [A,B].forEach(P=>{
      const end=P.T??Math.min(8,Math.max(2,2*Math.abs(P.vy)/g+2));
      for(let i=0;i<=80;i++)pts.push(pos(P,end*i/80,g));
      if(P.xf!=null)pts.push({x:P.xf,y:ground});
    });
    let xs=pts.map(p=>p.x).filter(Number.isFinite),ys=pts.map(p=>p.y).filter(Number.isFinite);
    let minX=Math.min(...xs,-10),maxX=Math.max(...xs,10),minY=Math.min(...ys,ground,-5),maxY=Math.max(...ys,ground,10);
    if(maxX-minX<10){minX-=5;maxX+=5} if(maxY-minY<10){minY-=5;maxY+=5}
    const px=(maxX-minX)*.1,py=(maxY-minY)*.12;
    return {minX:minX-px,maxX:maxX+px,minY:minY-py,maxY:maxY+py};
  }

  function mapper(vp){
    const pad=45,W=C.width,H=C.height,s=Math.min((W-2*pad)/(vp.maxX-vp.minX),(H-2*pad)/(vp.maxY-vp.minY));
    const usedW=(vp.maxX-vp.minX)*s,usedH=(vp.maxY-vp.minY)*s,ox=(W-usedW)/2,oy=(H-usedH)/2;
    return {X:x=>ox+(x-vp.minX)*s,Y:y=>H-(oy+(y-vp.minY)*s),S:s};
  }

  function nice(span){const p=10**Math.floor(Math.log10(Math.max(span,1e-6)));const q=span/p;return (q<2?.2:q<5?.5:1)*p}

  function draw(){
    const S=state(),{A,B,g,ground}=S;
    syncPad('A');syncPad('B');
    const end=Math.max(A.T||0,B.T||0,1);
    E.slider.max=end.toFixed(2); if(t>end)t=end; E.slider.value=t; E.timeOut.textContent=t.toFixed(2)+' s';E.clock.textContent='t = '+t.toFixed(2)+' s';

    const vp=view(A,B,g,ground),m=mapper(vp);
    ctx.clearRect(0,0,C.width,C.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,C.width,C.height);
    ctx.font='11px system-ui';ctx.fillStyle='#6b7280';ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;
    const dx=nice(vp.maxX-vp.minX),dy=nice(vp.maxY-vp.minY);
    for(let x=Math.ceil(vp.minX/dx)*dx;x<=vp.maxX;x+=dx){const X=m.X(x);ctx.beginPath();ctx.moveTo(X,0);ctx.lineTo(X,C.height);ctx.stroke();ctx.fillText(x.toFixed(Math.abs(dx)<1?1:0),X+3,C.height-6)}
    for(let y=Math.ceil(vp.minY/dy)*dy;y<=vp.maxY;y+=dy){const Y=m.Y(y);ctx.beginPath();ctx.moveTo(0,Y);ctx.lineTo(C.width,Y);ctx.stroke();ctx.fillText(y.toFixed(Math.abs(dy)<1?1:0),4,Y-4)}

    ctx.strokeStyle='#374151';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,m.Y(ground));ctx.lineTo(C.width,m.Y(ground));ctx.stroke();

    function trail(P,color){
      const end=P.T??Math.min(8,Math.max(2,2*Math.abs(P.vy)/g+2));
      ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();
      for(let i=0;i<=100;i++){const q=pos(P,end*i/100,g),X=m.X(q.x),Y=m.Y(q.y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}
      ctx.stroke();
    }
    trail(A,'#2563eb');trail(B,'#e11d48');

    function ball(P,color,label){
      const tt=P.T==null?t:Math.min(t,P.T),q=pos(P,tt,g),X=m.X(q.x),Y=m.Y(q.y);
      ctx.fillStyle=color;ctx.beginPath();ctx.arc(X,Y,8,0,2*Math.PI);ctx.fill();ctx.font='bold 13px system-ui';ctx.fillText(label,X+10,Y-8);
      // velocity vector
      const k=Math.min(3.2,Math.max(1,m.S*.07));
      ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X+q.vx*k,Y-q.vy*k);ctx.stroke();
      if(P.xf!=null){ctx.beginPath();ctx.arc(m.X(P.xf),m.Y(ground),4,0,2*Math.PI);ctx.fill()}
    }
    ball(A,'#2563eb','A');ball(B,'#e11d48','B');
    renderStats(A,B);
  }

  function f(v,d=2){return v==null?'—':Number(v).toFixed(d)}
  function stats(P){
    return `
      <div class="stat"><b>vx</b><span>${f(P.vx)} m/s</span></div>
      <div class="stat"><b>vy</b><span>${f(P.vy)} m/s</span></div>
      <div class="stat"><b>비행시간</b><span>${f(P.T)} s</span></div>
      <div class="stat"><b>최고높이</b><span>${f(P.maxY)} m</span></div>
      <div class="stat"><b>수평변위 Δx</b><span>${f(P.dx)} m</span></div>
      <div class="stat"><b>도착 x</b><span>${f(P.xf)} m</span></div>`;
  }
  function renderStats(A,B){
    E.statsA.innerHTML=stats(A);E.statsB.innerHTML=stats(B);
    const dr=A.xf!=null&&B.xf!=null?Math.abs(A.xf-B.xf):null,dt=A.T!=null&&B.T!=null?Math.abs(A.T-B.T):null;
    E.compare.innerHTML=`<b>현재 비교</b><br>도착 x 차이: <b>${f(dr)} m</b><br>비행시간 차이: <b>${f(dt)} s</b><br>각도 차이: <b>${f(Math.abs(A.ang-B.ang),1)}°</b>`;
  }

  function resetTime(redraw=true){running=false;if(raf)cancelAnimationFrame(raf);raf=null;t=0;last=0;if(redraw)draw()}
  function animate(ts){
    if(!running)return;
    if(!last)last=ts;
    const dt=Math.min((ts-last)/1000,.05)*n(E.playback,1);last=ts;t+=dt;
    const {A,B}=state(),end=Math.max(A.T||0,B.T||0,1);
    if(t>=end){t=end;running=false}
    draw(); if(running)raf=requestAnimationFrame(animate);
  }

  E.launch.addEventListener('click',()=>{resetTime(false);running=true;last=0;raf=requestAnimationFrame(animate)});
  E.pause.addEventListener('click',()=>{running=false;if(raf)cancelAnimationFrame(raf);raf=null});
  E.reset.addEventListener('click',()=>resetTime());
  E.slider.addEventListener('input',()=>{running=false;if(raf)cancelAnimationFrame(raf);raf=null;t=n(E.slider);draw()});

  ['g','ground','maxSpeed','vA','angA','xA','yA','vB','angB','xB','yB'].forEach(id=>{
    E[id].addEventListener('input',()=>resetTime());
  });
  E.playback.addEventListener('change',draw);

  E.match.addEventListener('click',()=>{
    const S=state(),A=S.A,theta=rad(n(E.angB)),x0=n(E.xB),y0=n(E.yB);
    if(A.xf==null){alert('A가 착지선에 도달하지 않습니다.');return}
    const target=A.xf;
    function err(v){
      const P={x0,y0,v,ang:n(E.angB),vx:v*Math.cos(theta),vy:v*Math.sin(theta)};
      const T=landingTime(P,S.g,S.ground);
      if(T==null)return null;
      return P.x0+P.vx*T-target;
    }
    let best=null,bestErr=Infinity,max=Math.max(10,n(E.maxSpeed,100));
    for(let i=0;i<=3000;i++){
      const v=max*i/3000,er=err(v);
      if(er!=null&&Math.abs(er)<bestErr){bestErr=Math.abs(er);best=v}
    }
    if(best==null||bestErr>0.5){alert('현재 B 각도와 출발점에서는 최대 속도 범위 안에서 같은 도착점을 찾기 어렵습니다. 최대 속도를 키워보세요.');return}
    E.vB.value=best.toFixed(1);resetTime();
  });

  bindPad('A');bindPad('B');
  draw();
})();
</script>
</body>
</html>
